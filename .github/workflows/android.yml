name: Build Poke Deal APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Poke-Deal-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish phone download link
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE: ${{ github.head_ref || github.ref_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Poke-Deal-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Poke-Deal-debug.apk \
            --prerelease \
            --target "$SHA" \
            --title "Latest test build" \
            --notes "Built from $SOURCE at ${SHA::7}. Uninstall the old Poke Deal before installing."
