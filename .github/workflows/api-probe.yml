name: API probe (temporary)
on:
  push:
    branches: [api-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe price APIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "## filter by name + set id (Obsidian Flames = sv03)"
            curl -s -m 25 -D h.txt 'https://api.tcgdex.net/v2/en/cards?name=eq:Charizard%20ex&set.id=eq:sv03' | jq -c '[.[]? | {id, name}]'
            grep -i -E "ratelimit|cache-control|x-" h.txt | head -8
            echo
            echo "## name like (no eq)"
            curl -s -m 25 'https://api.tcgdex.net/v2/en/cards?name=moonbreon' | jq -c '[.[]? | .id] | .[:5]'
            curl -s -m 25 'https://api.tcgdex.net/v2/en/cards?name=Umbreon%20VMAX&set.id=eq:swsh7' | jq -c '[.[]? | {id, name}]'
            echo
            echo "## SIR detail sv03-223"
            curl -s -m 25 'https://api.tcgdex.net/v2/en/cards/sv03-223' | jq -c '{id, name, rarity, variants, pricing: .pricing.tcgplayer}'
            echo "## Umbreon VMAX alt swsh7-215"
            curl -s -m 25 'https://api.tcgdex.net/v2/en/cards/swsh7-215' | jq -c '{id, name, rarity, pricing: .pricing.tcgplayer}'
            echo
            echo "## Delta Reign set: count + rarities + one priced card"
            curl -s -m 25 'https://api.tcgdex.net/v2/en/sets/me06' > s.json
            jq -c '{name, cardCount, serie: .serie.name, first: [.cards[:3][] | .id]}' s.json
            last=$(jq -r '.cards[-1].id' s.json)
            curl -s -m 25 "https://api.tcgdex.net/v2/en/cards/$last" | jq -c '{id, name, rarity, pricing: .pricing.tcgplayer}'
            echo
            echo "## sets list size + sample fields"
            curl -s -m 25 'https://api.tcgdex.net/v2/en/sets' | jq -c 'length, .[0], (.[] | select(.id|test("^A")) | .id)' | head -6
            echo "## series list"
            curl -s -m 25 'https://api.tcgdex.net/v2/en/series' | jq -c '[.[] | .id + "=" + .name]'
            echo "## sealed? search Elite Trainer"
            curl -s -m 25 -o x.json -w "HTTP %{http_code}\n" 'https://api.tcgdex.net/v2/en/sealed'; head -c 300 x.json; echo
          } > out.txt 2>&1
          cat out.txt
          gh release delete api-probe --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create api-probe -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "API probe" --notes-file out.txt
